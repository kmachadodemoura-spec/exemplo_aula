<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Torcedor</title>
    <link rel="stylesheet" href="../CSS/style.css">
</head>

<body>

    <nav>
        <a href="index.html">Início</a>
        <a href="index2.html">Classificação</a>
        <a href="index1.html">Cadastro</a>
        <a href="resultado.html">Resultado</a>
    </nav>

    <div class="container">

        <h1>Cadastro de Torcedor</h1>

        <form id="formulario">

            <label for="nome">Nome Completo</label>
            <input
                type="text"
                id="nome_completo"
                placeholder="Digite seu nome"
                required>

            <label for="email">E-mail</label>
            <input
                type="email"
                id="email"
                placeholder="Digite seu e-mail"
                required>

            <label for="data">Data de Nascimento</label>
            <input
                type="date"
                id="data_nascimento"
                required>

            <label>
                País Favorito

                <select id="pais_favorito">

                    <option>Egito</option>

                </select>

            </label>

            <label>
                Jogador Favorito

                <select id="jogador_favorito">

                    <option>Mohamed Salah</option>
                    <option>Mohamed El Shenawy</option>
                    <option>Omar Marmoush</option>
                    <option>Mostafa Mohamed</option>
                    <option>Mahmoud Trezeguet</option>
                    <option>Ahmed Hegazi</option>
                    <option>Hamdi Fathi</option>
                    <option>Marwan Attia</option>
                    <option>Emam Ashour</option>
                    <option>Mohamed Abdelmonem</option>
                    <option>Ahmed Sayed Zizo</option>
                    <option>Mohamed Hany</option>
                    <option>Mostafa Fathi</option>
                    <option>Ahmed Hassan Kouka</option>

                </select>

            </label>

            <br><br>

            <button id="btnEnviar">
                Cadastrar
            </button>

        </form>

    </div>

    <script src="./../JS/script.js"></script>

</body>

</html>
